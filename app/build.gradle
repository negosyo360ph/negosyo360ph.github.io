plugins { id 'com.android.application' }

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.negosyo360.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.negosyo360.app'
        minSdk 24
        targetSdk 34
        versionCode runNo
        versionName "0.1.${runNo}"
    }
    signingConfigs {
        pilot {
            storeFile file('n360-release.jks')
            storePassword 'n360pilot'
            keyAlias 'n360'
            keyPassword 'n360pilot'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.pilot }
        debug { signingConfig signingConfigs.pilot }
    }
    sourceSets { main { assets.srcDirs = ['../docs/app'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
