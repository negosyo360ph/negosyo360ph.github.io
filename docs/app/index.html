<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12406a">
<title>Negosyo360</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Negosyo360 app. Phone-first: one column, bottom tabs, bottom sheets for every form. */
:root{
  --brand:#12406a; --brand-2:#1d5d93;
  --accent:#e8892b; --accent-soft:#fdf0e1;
  --ink:#14212f; --ink-2:#56677b; --line:#e1e6ec;
  --bg:#f2f4f7; --surface:#ffffff;
  --good:#1d8456; --good-soft:#e3f4ea;
  --warn:#b26f00; --warn-soft:#fbf0d9;
  --bad:#bf3b35; --bad-soft:#fbe6e4;
  --display:"Sora","Segoe UI",Roboto,system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#dfe4ea;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#root{max-width:520px;margin:0 auto;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.body{flex:1;overflow-y:auto;padding:6px 16px 20px}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:11px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:var(--brand)}
.tabs svg{width:22px;height:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:12px 16px;font-weight:700;font-size:15px;text-decoration:none}
.btn-primary{background:var(--accent);color:#1b1206}
.btn-dark{background:var(--brand);color:#fff}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--surface);border:1.5px solid #efc9c6;color:var(--bad)}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:#e5eef7;color:var(--brand-2)}
.p-acc{background:var(--accent-soft);color:#8a4a0b}

.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}
.head h2{font-size:21px}
.head .sub{font-size:12.5px;color:var(--ink-2);display:block}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#1b1206;font-weight:800;display:grid;place-items:center;font-size:13px;flex:none;border:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h4{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h4 small{font-family:var(--body);font-weight:600;color:var(--ink-2);font-size:12px}
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:16px;margin-bottom:10px}
.hero small{opacity:.8;font-size:12.5px}
.hero .amt{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1}
.hero .chg{font-size:12px;font-weight:700;background:rgba(255,255,255,.16);padding:2px 9px;border-radius:999px;display:inline-block;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.tile small{font-size:11.5px;color:var(--ink-2);display:block;line-height:1.3}
.tile b{font-family:var(--display);font-size:17px;display:block;margin-top:2px}
.tile.alert b{color:var(--bad)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 2px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px}
.qa i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:#8a4a0b}
.ask{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--brand-2);border-radius:14px;padding:11px 12px;width:100%;text-align:left;font-size:14px;color:var(--ink-2);margin-bottom:10px}
.ask b{color:var(--brand)}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.al:first-of-type{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.d-bad{background:var(--bad)}.d-warn{background:var(--accent)}.d-good{background:var(--good)}
.health{display:flex;gap:14px;align-items:center}
.health p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.seg{display:flex;background:#e3e8ee;border-radius:12px;padding:3px;margin-bottom:12px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:9px;font-weight:700;font-size:12.5px;white-space:nowrap}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pitem{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:9px;text-align:left;position:relative;display:flex;flex-direction:column;gap:2px;min-height:90px}
.pitem b{font-size:12.5px;line-height:1.25}
.pitem .pr{font-family:var(--display);font-weight:700;color:var(--brand);font-size:14px;margin-top:auto}
.pitem .st{font-size:10.5px;color:var(--ink-2)}
.pitem .q{position:absolute;top:-7px;right:-6px;background:var(--accent);color:#1b1206;font-weight:800;font-size:11px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px}
.pitem.sel{border-color:var(--accent)}
.pitem.low .st{color:var(--bad);font-weight:700}
.cartbar{position:sticky;bottom:0;margin-top:10px;background:var(--ink);color:#fff;border-radius:14px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;border:0;width:100%;font-weight:700;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.cartbar b{font-family:var(--display);font-size:17px}
.list .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.grow b{display:block;font-size:14px}
.grow span{display:block;font-size:12px;color:var(--ink-2)}
.amt{font-family:var(--display);font-weight:700;text-align:right;font-size:14px;white-space:nowrap}
.amt span{display:block;font-family:var(--body);font-weight:600;font-size:11px;color:var(--ink-2)}
.ico{width:38px;height:38px;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--brand-2);flex:none;font-size:12px}
.prog{height:7px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;background:var(--brand-2);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-top:1px dashed var(--line)}
.kv:first-of-type{border-top:0}
.kv.tot{font-weight:800;font-size:15px;border-top:1.5px solid var(--ink);margin-top:4px;padding-top:9px}
.neg{color:var(--bad)}
canvas{width:100%;height:170px;display:block}
.empty{color:var(--ink-2);font-size:13px;padding:8px 0;margin:0}
.big{font-family:var(--display);font-size:26px;font-weight:700}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;font-weight:700;color:var(--ink-2)}
.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface);width:100%;min-width:0}
.inrow{display:flex;gap:6px}
.inrow input{flex:1}
.methods{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.methods button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 2px;font-size:11.5px;font-weight:800}
.methods button.on{border-color:var(--brand);background:#e5eef7;color:var(--brand)}
.cartline{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.cartline:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0}
.sheet-bg{position:absolute;inset:0;background:rgba(14,22,32,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 10px}
.sheet h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--bg);border-radius:9px;width:32px;height:32px;font-weight:800;flex:none}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#fbfbf8;border:1px dashed #c9cfd6;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.45;overflow-x:auto}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:90%;padding:9px 12px;border-radius:14px;font-size:13.5px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sugg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600;text-align:left}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:10px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox::after{content:"";position:absolute;left:12%;right:12%;top:42%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.scanstat{font-size:13px;color:var(--ink-2);margin-bottom:10px}

/* onboarding & lock */
.welcome{flex:1;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top)) 22px 28px;background:linear-gradient(180deg,#eaf1f8,var(--bg) 40%)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--brand)}
.logo b{color:var(--accent)}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.mark i{width:20px;height:20px;border-radius:50%;background:conic-gradient(from 300deg,var(--accent) 0 120deg,var(--brand-2) 120deg 360deg);display:grid;place-items:center}
.mark i::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.welcome h1{font-size:28px;line-height:1.12;color:var(--brand);margin:22px 0 8px}
.welcome p.lead{color:var(--ink-2);margin:0 0 20px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:18px auto}
.pinpad button{height:60px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:22px;font-weight:700}
.pindots{display:flex;gap:12px;justify-content:center;margin:16px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.pindots i.on{background:var(--brand)}

.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:.25s;z-index:60;max-width:min(92vw,440px);pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script src="vendor/zxing.min.js" defer></script>
<script>
(function(){
'use strict';
/* =========================================================
   STORAGE & HELPERS
   ========================================================= */
const KEY='negosyo360-data-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=(n,dec)=>{n=+n||0;const d=dec&&Math.round(n*100)%100!==0;return (n<0?'-':'')+'₱'+Math.abs(n).toLocaleString('en-PH',{minimumFractionDigits:d?2:0,maximumFractionDigits:d?2:0});};
const pad=n=>String(n).padStart(2,'0');
const dk=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const todayKey=()=>dk(Date.now());
const keyAdd=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dk(d);};
const fmtTime=t=>new Date(t).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
const fmtDate=(k,o)=>new Date((typeof k==='string'?k+'T12:00:00':k)).toLocaleDateString('en-PH',o||{month:'short',day:'numeric'});
const abbr=n=>String(n).replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EXP_CATS=['Supplies','Electricity','Water','Rent','Transport','Salary','Internet / load','Others','Stock purchase'];
const BIZ_TYPES=['Sari-sari store','Retail shop','Food business','Online seller','Reseller','Freelancer / services','Other'];
const METHODS=['Cash','GCash','Maya','Bank','Utang'];

let D=null;
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){ toast('Could not save on this device. Storage may be full.'); } }
const nid=()=>++D.nextId;

function blank(biz){
  return {ver:1,created:Date.now(),biz,products:[],sales:[],expenses:[],utang:[],
    employees:[{id:1,name:biz.owner,role:'Owner',comm:0}],attendance:[],days:{},stockLog:[],user:1,nextId:100};
}

/* ---------- Sample data (realistic sari-sari store, 8 days of history) ---------- */
function sampleData(biz){
  const d=blank(biz);
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  const P=[
    ['Coke 1.5L','Drinks',62,75,22,14,'4801981116317','Coca-Cola dealer'],
    ['Lucky Me Pancit Canton','Noodles',13,16,150,30,'4807770271212','Puregold Wholesale'],
    ['Bear Brand 33g','Milk & coffee',11,14,70,18,'4800361385112','Puregold Wholesale'],
    ['Kopiko 3-in-1 (10s)','Milk & coffee',58,70,10,5,'','Puregold Wholesale'],
    ['Rice, per kilo','Rice & eggs',46,54,90,22,'','Mang Ador Bigasan'],
    ['Egg, large','Rice & eggs',7.5,9,130,36,'','Poultry supplier'],
    ['555 Sardines 155g','Canned',21,26,9,9,'4800110012345','Puregold Wholesale'],
    ['Palmolive shampoo sachet','Toiletries',6,8,140,25,'','Puregold Wholesale'],
    ['SkyFlakes (10s)','Snacks',58,68,18,4,'4800016644290','Puregold Wholesale'],
    ['Cooking oil, 1/4 L','Condiments',19,24,6,8,'','Puregold Wholesale'],
    ['Tide powder 66g','Toiletries',9,12,80,10,'','Puregold Wholesale'],
    ['Ice, per pack','Drinks',3,5,90,25,'','Local'],
    ['Red Horse 500ml','Drinks',58,70,30,6,'4801234000017','San Miguel dealer'],
    ['Datu Puti soy sauce 200ml','Condiments',14,18,24,2,'4800047800213','Puregold Wholesale']
  ];
  d.products=P.map(([name,cat,cost,price,stock,v,barcode,supplier],i)=>({id:i+1,name,cat,cost,price,stock,barcode,supplier,_v:v}));
  d.nextId=1000;
  d.employees=[{id:1,name:biz.owner,role:'Owner',comm:0},{id:2,name:'Jomar Reyes',role:'Tindero',comm:1},{id:3,name:'Lea Santos',role:'Tindera',comm:1}];
  const now=new Date(), tk=dk(now);
  const totalV=d.products.reduce((a,p)=>a+p._v,0);
  const pick=()=>{let r=rnd()*totalV;for(const p of d.products){r-=p._v;if(r<=0)return p;}return d.products[0];};
  for(let back=7;back>=0;back--){
    const day=new Date(now); day.setDate(now.getDate()-back);
    const open=new Date(day); open.setHours(6,30,0,0);
    const close=new Date(day); close.setHours(21,0,0,0);
    const end=back===0?Math.min(now.getTime(),close.getTime()):close.getTime();
    if(end<=open.getTime()) continue;
    const frac=(end-open.getTime())/(close-open);
    const count=Math.round((52+rnd()*16)*frac*(day.getDay()===0||day.getDay()===6?1.15:1));
    for(let i=0;i<count;i++){
      const t=open.getTime()+(end-open.getTime())*((i+rnd())/count);
      const n=1+Math.floor(rnd()*2.3), items=[], used=new Set();
      for(let k=0;k<n;k++){ const p=pick(); if(used.has(p.id)) continue; used.add(p.id);
        const q=Math.max(1,Math.round(rnd()*(p.price<20?6:2)+0.4)); items.push({pid:p.id,name:p.name,qty:q,price:p.price,cost:p.cost}); }
      const r=rnd(), method=r<0.66?'Cash':r<0.84?'GCash':r<0.92?'Maya':r<0.95?'Bank':'Utang';
      const total=items.reduce((a,x)=>a+x.qty*x.price,0);
      d.sales.push({id:++d.nextId,time:Math.round(t),items,disc:0,method,total,emp:1+Math.floor(rnd()*3),refunded:false,customer:method==='Utang'?['Aling Baby','Kuya Ramon','Tess','Mang Isko'][Math.floor(rnd()*4)]:'',ref:''});
    }
    const k=dk(day);
    d.days[k]={opening:1500,withdrawals:back===0?0:1000+Math.round(rnd()*4)*500,counted:null};
    const ex=[['Supplies',150+Math.round(rnd()*80),'Plastic bags, ice'],['Transport',100+Math.round(rnd()*60),'Tricycle to supplier']];
    if(back===3) ex.push(['Electricity',2450,'Electric bill']);
    if(back===5) ex.push(['Stock purchase',3800,'Restock from Puregold']);
    ex.forEach(([cat,amt,note],j)=>{ if(back===0&&j>0) return; d.expenses.push({id:++d.nextId,time:open.getTime()+3600e3*(2+j*3),cat,amt,method:'Cash',note}); });
    if(back>0){ const exp=d.days[k]; exp.counted=null; }
    if(back<=1) d.employees.forEach(e=>d.attendance.push({emp:e.id,date:k,tin:open.getTime()+e.id*12*60000,tout:back===1?close.getTime():null}));
  }
  d.attendance=d.attendance.filter(a=>!(a.date===tk&&a.emp===3));
  const dd=n=>keyAdd(tk,n);
  d.utang=[
    {id:++d.nextId,name:'Aling Baby',phone:'',amount:1850,borrowed:Date.now()-20*864e5,due:dd(-5),items:'Rice, eggs, canned goods',payments:[{time:Date.now()-9*864e5,amt:500,method:'Cash'}]},
    {id:++d.nextId,name:'Kuya Ramon',phone:'',amount:1150,borrowed:Date.now()-12*864e5,due:dd(-2),items:'Red Horse, SkyFlakes',payments:[]},
    {id:++d.nextId,name:'Tess',phone:'',amount:640,borrowed:Date.now()-6*864e5,due:dd(4),items:'Pancit Canton, Bear Brand',payments:[{time:Date.now()-2*864e5,amt:200,method:'GCash'}]},
    {id:++d.nextId,name:'Mang Isko',phone:'',amount:320,borrowed:Date.now()-864e5,due:dd(6),items:'Cooking oil, soy sauce',payments:[]}];
  const wk=new Set(Array.from({length:7},(_,i)=>keyAdd(tk,-i-1))), units={};
  d.sales.forEach(x=>{ if(wk.has(dk(x.time))) x.items.forEach(i=>units[i.pid]=(units[i.pid]||0)+i.qty); });
  const cover={1:1.6,4:2.2,7:0.8,10:1.2};
  d.products.forEach(p=>{ const v=(units[p.id]||0)/7; p.stock=Math.max(2,Math.round(v*(cover[p.id]||(8+(p.id*5)%12)))); delete p._v; });
  d.sample=true;
  return d;
}

/* =========================================================
   CALCULATIONS
   ========================================================= */
const prod=id=>D.products.find(p=>p.id===id);
const live=()=>D.sales.filter(s=>!s.refunded);
function salesIn(keys){ const set=new Set(keys); return live().filter(s=>set.has(dk(s.time))); }
function periodKeys(p){
  const t=todayKey();
  if(p==='today') return [t];
  if(p==='yesterday') return [keyAdd(t,-1)];
  if(p==='7d') return Array.from({length:7},(_,i)=>keyAdd(t,-i));
  if(p==='month'){ const out=[]; let k=t; while(k.slice(0,7)===t.slice(0,7)){ out.push(k); k=keyAdd(k,-1);} return out; }
  return [t];
}
function stats(keys){
  const s=salesIn(keys), set=new Set(keys);
  const sales=s.reduce((a,x)=>a+x.total,0);
  const cogs=s.reduce((a,x)=>a+x.items.reduce((b,i)=>b+i.qty*i.cost,0),0);
  const disc=s.reduce((a,x)=>a+(x.disc||0),0);
  const exps=D.expenses.filter(e=>set.has(dk(e.time)));
  const exp=exps.filter(e=>e.cat!=='Stock purchase').reduce((a,e)=>a+e.amt,0);
  const stockBuy=exps.filter(e=>e.cat==='Stock purchase').reduce((a,e)=>a+e.amt,0);
  const by={Cash:0,GCash:0,Maya:0,Bank:0,Utang:0}; s.forEach(x=>by[x.method]=(by[x.method]||0)+x.total);
  return {sales,cogs,gross:sales-cogs,exp,stockBuy,net:sales-cogs-exp,tx:s.length,by,disc,exps,list:s};
}
function soldUnits(keys){ const m={}; salesIn(keys).forEach(s=>s.items.forEach(i=>m[i.pid]=(m[i.pid]||0)+i.qty)); return m; }
let _velCache=null;
function velMap(){ if(_velCache) return _velCache;
  const keys=Array.from({length:7},(_,i)=>keyAdd(todayKey(),-i-1)); // last 7 full days
  const m=soldUnits(keys), days=Math.max(1,Math.min(7,Math.ceil((Date.now()-D.created)/864e5)));
  const out={}; D.products.forEach(p=>out[p.id]=(m[p.id]||0)/(D.sample?7:days)); return _velCache=out; }
const vel=p=>Math.round((velMap()[p.id]||0)*10)/10;
const daysLeft=p=>{const v=vel(p);return v>0?p.stock/v:Infinity;};
const isLow=p=>p.stock<=0||daysLeft(p)<=3;
const lowStock=()=>D.products.filter(isLow);
const paidOf=u=>u.payments.reduce((a,x)=>a+x.amt,0);
const bal=u=>Math.max(0,u.amount-paidOf(u));
const overdue=u=>bal(u)>0&&u.due<todayKey();
function dayRec(k){
  if(!D.days[k]){ const prev=Object.keys(D.days).filter(x=>x<k).sort().pop(); const pc=prev&&D.days[prev].counted;
    D.days[k]={opening:pc!=null?pc-(D.days[prev].withdrawalsAfterCount||0):(D.biz.opening||0),withdrawals:0,counted:null}; }
  return D.days[k];
}
function cashFlow(k){
  const r=dayRec(k), st=stats([k]);
  const cashExp=st.exps.filter(e=>e.method==='Cash').reduce((a,e)=>a+e.amt,0);
  const uCash=D.utang.reduce((a,u)=>a+u.payments.filter(p=>p.method==='Cash'&&dk(p.time)===k).reduce((b,p)=>b+p.amt,0),0);
  const expected=r.opening+st.by.Cash+uCash-cashExp-r.withdrawals;
  return {r,cashSales:st.by.Cash,uCash,cashExp,expected,st};
}
function yesterdaySoFar(){
  const y=keyAdd(todayKey(),-1), n=new Date(), mins=n.getHours()*60+n.getMinutes();
  return salesIn([y]).filter(s=>{const t=new Date(s.time);return t.getHours()*60+t.getMinutes()<=mins;}).reduce((a,s)=>a+s.total,0);
}
function health(){
  if(live().length<15) return null;
  const t=stats([todayKey()]), w=stats(periodKeys('7d')), ys=yesterdaySoFar();
  const growth=ys?Math.max(0,Math.min(1,0.5+(t.sales-ys)/ys)):0.5;
  const margin=w.sales?Math.max(0,Math.min(1,(w.gross/w.sales)/0.22)):0.5;
  const stock=D.products.length?1-lowStock().length/D.products.length:1;
  const tu=D.utang.reduce((a,u)=>a+bal(u),0), od=D.utang.filter(overdue).reduce((a,u)=>a+bal(u),0);
  const recv=tu?1-(od/tu)*0.8:1;
  const expR=w.sales?Math.max(0,Math.min(1,1-((w.exp/w.sales)-0.05)/0.2)):0.5;
  const parts=[['Sales growth',growth,20],['Profitability',margin,25],['Inventory',stock,20],['Receivables',recv,15],['Expenses',expR,20]];
  const score=Math.round(parts.reduce((a,[,v,wt])=>a+v*wt,0));
  return {score,parts,weakest:parts.slice().sort((a,b)=>a[1]-b[1])[0][0]};
}
function restockPlan(){
  return D.products.filter(p=>vel(p)>0&&daysLeft(p)<=4).map(p=>{const qty=Math.max(0,Math.ceil(vel(p)*7-p.stock));return {p,qty,cost:qty*p.cost};}).filter(x=>x.qty>0).sort((a,b)=>daysLeft(a.p)-daysLeft(b.p));
}
function topProducts(keys,n){ const m=soldUnits(keys); return D.products.map(p=>({p,qty:m[p.id]||0,rev:(m[p.id]||0)*p.price})).filter(x=>x.qty).sort((a,b)=>b.rev-a.rev).slice(0,n); }
function slowProducts(n){ return D.products.filter(p=>p.stock>0).sort((a,b)=>vel(a)-vel(b)).slice(0,n); }

function completeSale(){
  const lines=Object.entries(UI.cart).filter(([,q])=>q>0); if(!lines.length) return;
  const sub=cartSub(), disc=Math.min(Math.max(0,+UI.disc||0),sub), total=Math.round((sub-disc)*100)/100;
  if(UI.method==='Cash'&&UI.cashIn!==''&&+UI.cashIn<total){ toast('Cash received is less than the total.'); return; }
  if(UI.method==='Utang'&&!UI.cust.trim()){ toast('Enter the customer\'s name for utang.'); return; }
  const items=lines.map(([id,q])=>{const p=prod(+id);p.stock-=q;return {pid:p.id,name:p.name,qty:q,price:p.price,cost:p.cost};});
  const s={id:nid(),time:Date.now(),items,disc,method:UI.method,total,emp:D.user,refunded:false,customer:UI.method==='Utang'?UI.cust.trim():'',ref:UI.ref.trim()};
  D.sales.push(s);
  if(s.method==='Utang'){
    let u=D.utang.find(x=>x.name.toLowerCase()===s.customer.toLowerCase()&&bal(x)>0);
    const names=items.map(i=>i.name).join(', ');
    if(u){ u.amount+=total; u.items=(u.items?u.items+', ':'')+names; }
    else D.utang.push({id:nid(),name:s.customer,phone:'',amount:total,borrowed:Date.now(),due:keyAdd(todayKey(),14),items:names,payments:[]});
  }
  UI.receipt={s,cash:UI.method==='Cash'&&UI.cashIn!==''?+UI.cashIn:0};
  UI.cart={};UI.disc='';UI.cashIn='';UI.cust='';UI.ref='';UI.method='Cash';UI.sheet='receipt';
  save(); render();
}
function receiptText(s,cash){
  const W=32, line=(a,b)=>{a=String(a);b=String(b);return a+' '.repeat(Math.max(1,W-a.length-b.length))+b;};
  const L=[D.biz.name.toUpperCase(),D.biz.city||'',`Receipt #${s.id}`,new Date(s.time).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}),'-'.repeat(W)];
  s.items.forEach(i=>{L.push(i.name);L.push(line(`  ${i.qty} x ${peso(i.price,1)}`,peso(i.qty*i.price,1)));});
  L.push('-'.repeat(W));
  if(s.disc) L.push(line('Discount','-'+peso(s.disc,1)));
  L.push(line('TOTAL',peso(s.total,1)));
  L.push(line('Paid by '+s.method,s.method==='Cash'&&cash?peso(cash,1):''));
  if(s.method==='Cash'&&cash) L.push(line('Change',peso(cash-s.total,1)));
  if(s.ref) L.push('Ref no. '+s.ref);
  if(s.customer) L.push('Utang of: '+s.customer);
  if(s.refunded) L.push('*** REFUNDED ***');
  L.push('','Salamat po! Balik po kayo.','This is not an official receipt.');
  return L.filter(x=>x!=null).join('\n');
}

const SUGG=['How much did I earn today?','What are my top products?','What should I reorder?','How much money do I need to restock?','Why is my profit lower?','If I increase my best seller by ₱5, what happens?','Which employee has the highest sales?','Can I afford to open another branch?'];
function answer(q){
  const s=q.toLowerCase(), t=stats([todayKey()]), w=stats(periodKeys('7d'));
  if(/earn|kita|today|ngayon/.test(s)&&!/top|best/.test(s)) return `Today you sold ${peso(t.sales,1)} in ${t.tx} transactions. After the cost of goods (${peso(t.cogs,1)}) and expenses (${peso(t.exp,1)}), your estimated profit is ${peso(t.net,1)}.`;
  if(/how much money|budget|need to restock|magkano/.test(s)){ const r=restockPlan(); return r.length?`To cover 7 days of sales for items running low, you need about ${peso(r.reduce((a,x)=>a+x.cost,0))}:\n`+r.map(x=>`• ${x.p.name}: ${x.qty} × ${peso(x.p.cost,1)} = ${peso(x.cost)}`).join('\n')+`\n\nExpected cash in your drawer now: ${peso(cashFlow(todayKey()).expected,1)}.`:'Nothing needs restocking this week based on your sales.'; }
  if(/reorder|restock|order|ubos/.test(s)){ const r=restockPlan(); return r.length?'Reorder these first, sorted by how soon they run out:\n'+r.map(x=>`• ${x.p.name}: ${x.p.stock} left, sells ~${vel(x.p)}/day, about ${Math.max(1,Math.round(daysLeft(x.p)))} day(s) left. Order ${x.qty}.`).join('\n'):'All products have more than 4 days of stock. No reorder needed yet.'; }
  if(/₱\s?\d|\bp\d|increase|price|presyo|taas/.test(s)) return priceAnswer(s);
  if(/top|best|mabenta/.test(s)&&!/employee|staff/.test(s)){ const top=topProducts(periodKeys('7d'),5); return top.length?'Your top products in the last 7 days:\n'+top.map((x,i)=>`${i+1}. ${x.p.name}: ${x.qty} sold, ${peso(x.rev)}`).join('\n'):'No sales recorded yet.'; }
  if(/why|lower|bumaba|profit/.test(s)){
    const prev=stats(Array.from({length:7},(_,i)=>keyAdd(todayKey(),-7-i)));
    const firstDay=Math.min(...D.sales.map(x=>x.time),Date.now());
    if(!prev.sales||firstDay>new Date(keyAdd(todayKey(),-13)+'T00:00:00').getTime()){
      const y=stats([keyAdd(todayKey(),-1)]), ys=yesterdaySoFar();
      const r=[]; if(t.sales<ys) r.push(`sales today (${peso(t.sales)}) are behind yesterday at this time (${peso(ys)})`);
      const m=t.sales?t.gross/t.sales:0, ym=y.sales?y.gross/y.sales:0; if(t.sales&&ym&&m<ym-0.01) r.push(`today's gross margin is ${Math.round(m*100)}% versus ${Math.round(ym*100)}% yesterday, so more low-margin items like rice and eggs were sold`);
      if(t.exp>y.exp) r.push(`expenses today (${peso(t.exp)}) are higher than yesterday (${peso(y.exp)})`);
      if(lowStock().length) r.push(`${lowStock().length} products are low or out of stock, so you may be losing sales`);
      return (r.length?'Compared with yesterday:\n• '+r.join('\n• '):'Your profit today is in line with yesterday.')+'\n\nAfter two weeks of records I can also compare week to week.'; }
    const r=[], m=w.sales?w.gross/w.sales:0, pm=prev.gross/prev.sales;
    if(w.net<prev.net) r.push(`profit this week is ${peso(w.net)} compared with ${peso(prev.net)} the week before`);
    if(w.sales<prev.sales) r.push(`sales dropped by ${peso(prev.sales-w.sales)} (${Math.round((1-w.sales/prev.sales)*100)}%)`);
    if(m<pm-0.01) r.push(`your gross margin fell from ${Math.round(pm*100)}% to ${Math.round(m*100)}%, so more low-margin items were sold or costs went up`);
    if(w.exp>prev.exp) r.push(`expenses rose by ${peso(w.exp-prev.exp)}`);
    if(lowStock().length) r.push(`${lowStock().length} products are low or out of stock, so you may be losing sales`);
    if(w.disc) r.push(`you gave ${peso(w.disc)} in discounts`);
    return r.length?'Here is what changed versus last week:\n• '+r.join('\n• '):`Your profit is steady. This week: ${peso(w.net)}. Last week: ${peso(prev.net)}.`; }
  return answerRest(s);
}
function priceAnswer(s){ {
    const amt=+(s.match(/(?:₱|p)\s?(\d+)/)||[])[1]||5;
    const p=D.products.find(x=>s.includes(x.name.toLowerCase().split(/[ ,(]/)[0]))||topProducts(periodKeys('7d'),1)[0]?.p;
    if(!p) return 'Record some sales first so I can estimate.';
    const v=vel(p)||1, cur=(p.price-p.cost)*v, nv=v*0.9, nw=(p.price+amt-p.cost)*nv;
    return `${p.name} earns ${peso(p.price-p.cost,1)} per piece × ~${v}/day = ${peso(cur)} profit a day.\nAt ${peso(p.price+amt,1)}, if sales drop about 10% (to ~${nv.toFixed(1)}/day), profit becomes ${peso(nw)} a day: ${peso(Math.abs(nw-cur))} ${nw>=cur?'more':'less'} per day, about ${peso(Math.abs(nw-cur)*30)} a month.\nThis is an estimate. Check what nearby stores charge.`; } }
function answerRest(s){ const t=stats([todayKey()]), w=stats(periodKeys('7d'));
  if(/employee|staff|tindero|tindera/.test(s)){ const per={}; salesIn(periodKeys('7d')).forEach(x=>per[x.emp]=(per[x.emp]||0)+x.total); const sorted=D.employees.slice().sort((a,b)=>(per[b.id]||0)-(per[a.id]||0));
    return `${sorted[0].name} has the highest sales in the last 7 days at ${peso(per[sorted[0].id]||0)}.\n`+sorted.map(e=>`• ${e.name}: ${peso(per[e.id]||0)}`).join('\n'); }
  if(/branch|sangay|expand|another store/.test(s)){ const days=D.sample?7:Math.max(1,Math.min(30,Math.ceil((Date.now()-D.created)/864e5))), m=stats(Array.from({length:days},(_,i)=>keyAdd(todayKey(),-i-1))), daily=m.net/days, mo=daily*30;
    if(mo<=0) return 'Your records do not show a profit yet, so it is too early to open another branch.';
    return `Your average net profit is about ${peso(daily)} a day, or ${peso(mo)} a month.\nA small second store usually needs ₱80,000–₱150,000 for stock, rent deposit and setup. At your profit, that is about ${Math.round(80000/mo)}–${Math.round(150000/mo)} months of savings.\nBefore opening, collect overdue utang (${peso(D.utang.filter(overdue).reduce((a,u)=>a+bal(u),0))}) and keep at least one month of expenses as a buffer. This is a rough estimate, not financial advice.`; }
  return 'I can answer questions about your sales, profit, stock, utang, expenses and staff. Try one of the suggestions below.';
}

function sheetScan(){

async function startScan(mode){
  UI.scan={mode,active:true}; UI.sheet='scan'; renderSheet();
  const vid=$('scanvid'), stat=$('scanstat');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ stat.textContent='Camera is not available here. Type the barcode instead.'; return; }
  try{
    if('BarcodeDetector' in window){
      const formats=await BarcodeDetector.getSupportedFormats().catch(()=>[]);
      if(formats.length){
        const det=new BarcodeDetector({formats:formats.filter(f=>/ean|upc|code|itf|qr/.test(f))});
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        UI.scan.stream=stream; vid.srcObject=stream; await vid.play(); stat.textContent='Point the camera at the barcode.';
        const loop=async()=>{ if(!UI.scan||!UI.scan.active) return; try{ const r=await det.detect(vid); if(r.length){ gotCode(r[0].rawValue); return; } }catch(e){} setTimeout(loop,200); };
        loop(); return;
      }
    }
    if(!window.ZXing){ stat.textContent='Scanner is still loading. Try again in a moment, or type the barcode.'; return; }
    const reader=new ZXing.BrowserMultiFormatReader(); UI.scan.reader=reader;
    stat.textContent='Point the camera at the barcode.';
    reader.decodeFromConstraints({video:{facingMode:'environment'}},vid,(res)=>{ if(res&&UI.scan&&UI.scan.active) gotCode(res.getText()); });
  }catch(e){ stat.textContent=(e&&e.name==='NotAllowedError')?'Camera permission was denied. Allow camera access in your phone settings, or type the barcode.':'Could not open the camera. Type the barcode instead.'; }
}
function stopScan(){
  if(!UI.scan) return; UI.scan.active=false;
  try{ UI.scan.reader&&UI.scan.reader.reset(); }catch(e){}
  try{ UI.scan.stream&&UI.scan.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  const v=$('scanvid'); if(v&&v.srcObject){ try{v.srcObject.getTracks().forEach(t=>t.stop());}catch(e){} }
  UI.scan=null;
}
function beep(){ try{ navigator.vibrate&&navigator.vibrate(80); const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain(); o.frequency.value=1200; g.gain.value=0.08; o.connect(g); g.connect(a.destination); o.start(); setTimeout(()=>{o.stop();a.close();},110);}catch(e){} }
function gotCode(code){
  code=String(code).trim(); if(!code) return;
  const mode=UI.scan?UI.scan.mode:'pos'; stopScan(); beep();
  if(mode==='field'){ UI.pform.barcode=code; UI.sheet='product'; renderSheet(); toast('Barcode added.'); return; }
  const p=D.products.find(x=>x.barcode===code);
  if(p){ if(p.stock>(UI.cart[p.id]||0)){ UI.cart[p.id]=(UI.cart[p.id]||0)+1; toast(`Added ${p.name}`); } else toast(`${p.name} is out of stock.`);
    UI.sheet=null; UI.tab='sales'; render(); return; }
  openProdForm(null); UI.pform.barcode=code; renderSheet(); toast('New barcode. Add the product details once.');
}

function drawBars(c){
  if(!c) return; const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight; if(!w) return;
  const keys=Array.from({length:8},(_,i)=>keyAdd(todayKey(),i-7)), vals=keys.map(k=>stats([k]).sales);
  const labels=keys.map((k,i)=>i===7?'Today':DAYS[new Date(k+'T12:00:00').getDay()]);
  c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const step=Math.max(...vals)>20000?10000:Math.max(...vals)>5000?5000:1000;
  const max=Math.max(step,Math.ceil(Math.max(...vals)/step)*step), pl=42,pb=22,pt=18,ch=h-pb-pt,cw=w-pl-4,n=vals.length;
  x.font='11px "Plus Jakarta Sans",Roboto,sans-serif';x.textBaseline='middle';
  for(let g=0;g<=2;g++){const v=max/2*g,y=pt+ch-ch*v/max;x.strokeStyle='#e8ecf0';x.beginPath();x.moveTo(pl,y);x.lineTo(w-4,y);x.stroke();x.fillStyle='#56677b';x.textAlign='right';x.fillText(v?'₱'+(v>=1000?(v/1000)+'k':v):'₱0',pl-6,y);}
  const bw=Math.min(30,cw/n*0.6);
  vals.forEach((v,i)=>{const bx=pl+cw/n*i+(cw/n-bw)/2,bh=ch*v/max,by=pt+ch-bh,last=i===n-1;
    x.fillStyle=last?'#e8892b':'#1d5d93';x.beginPath();if(x.roundRect)x.roundRect(bx,by,bw,Math.max(bh,0.5),[4,4,0,0]);else x.rect(bx,by,bw,bh);x.fill();
    x.fillStyle='#56677b';x.textAlign='center';x.fillText(labels[i],bx+bw/2,h-pb/2);
    if(last){x.fillStyle='#14212f';x.font='700 11px "Plus Jakarta Sans",Roboto,sans-serif';x.textAlign='right';x.fillText(peso(v),Math.min(bx+bw,w-2),Math.max(10,by-8));x.font='11px "Plus Jakarta Sans",Roboto,sans-serif';}});
}

  if(window.N360Android&&N360Android.shareText){ N360Android.shareText(text); return; }
  if(navigator.share){ navigator.share({text}).catch(()=>{}); return; }
  try{ navigator.clipboard.writeText(text).then(()=>toast(label+' copied. Paste it in Messenger or SMS.'),()=>toast('Select the text and copy it.')); }catch(e){ toast('Select the text and copy it.'); }
}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function exportCSV(){
  const rows=[['Date','Time','Receipt','Items','Payment','Discount','Total','Cost','Profit','Customer','Reference','Sold by','Refunded']];
  D.sales.slice().sort((a,b)=>a.time-b.time).forEach(s=>{const cost=s.items.reduce((a,i)=>a+i.qty*i.cost,0);
    rows.push([dk(s.time),fmtTime(s.time),s.id,s.items.map(i=>`${i.qty}x ${i.name}`).join('; '),s.method,s.disc||0,s.total,cost.toFixed(2),(s.total-cost).toFixed(2),s.customer,s.ref,(D.employees.find(e=>e.id===s.emp)||{}).name||'',s.refunded?'yes':'']);});
  saveFile(`negosyo360-sales-${todayKey()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');
}

/* =========================================================
   EVENTS
   ========================================================= */
function readOb(){ const o=UI.ob||{}; document.querySelectorAll('[data-ob]').forEach(el=>o[el.dataset.ob]=el.value); UI.ob=o; return o; }
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=+t.dataset.id, v=t.dataset.v;
  if(a==='bgclose'){ if(e.target===t){ if(UI.scan) stopScan(); UI.sheet=null; renderSheet(); } return; }
  switch(a){
    case 'obStart': { const o=readOb(); if(!String(o.name||'').trim()||!String(o.owner||'').trim()){toast('Enter your business name and your name.');break;}
      D=blank({name:o.name.trim(),owner:o.owner.trim(),type:o.type||BIZ_TYPES[0],city:(o.city||'').trim(),opening:+o.opening||0,pin:''});
      D.days[todayKey()]={opening:+o.opening||0,withdrawals:0,counted:null};
      UI.unlocked=true; UI.tab='products'; save(); render(); setTimeout(()=>{openProdForm(null);},50); toast('Welcome! Add your first product.'); break; }
    case 'obSample': { const o=readOb(); D=sampleData({name:"Aling Nena's Sari-Sari Store",owner:'Nena Cruz',type:'Sari-sari store',city:o.city||'Calbayog City',opening:1500,pin:''}); UI.unlocked=true; save(); render(); break; }
    case 'goFresh': if(confirmTwice(t,'Tap again to clear the sample and set up your real business')){ try{localStorage.removeItem(KEY);}catch(err){} D=null; UI.ob=null; UI.tab='home'; render(); } break;
    case 'pinkey': { if(v==='⌫') UI.pin=UI.pin.slice(0,-1); else if(UI.pin.length<4) UI.pin+=v;
      if(UI.pin.length===4){ if(UI.pin===D.biz.pin){UI.unlocked=true;UI.pin='';} else {UI.pin='';toast('Wrong PIN. Try again.');} } render(); break; }
    case 'tab': UI.tab=v; UI.sheet=null; render(); $('body').scrollTop=0; break;
    case 'sheet': UI.sheet=v; if(v==='stockin') UI.stockPid=null; renderSheet(); break;
    case 'close': if(UI.scan) stopScan(); UI.sheet=null; UI.pform=null; render(); break;
    case 'lowgo': UI.tab='products'; UI.pfilter='Low stock'; render(); break;
    case 'utanggo': UI.tab='reports'; UI.rep='utang'; render(); break;
    case 'cashgo': UI.tab='reports'; UI.rep='cash'; render(); break;
    case 'repgo': UI.tab='reports'; UI.rep=v; render(); break;
    case 'cat': UI.cat=v; render(); break;
    case 'allTx': UI.allTx=true; render(); break;
    case 'add': { const p=prod(id); if(p&&(UI.cart[id]||0)<p.stock) UI.cart[id]=(UI.cart[id]||0)+1; render(); break; }
    case 'dec': UI.cart[id]=(UI.cart[id]||0)-1; if(UI.cart[id]<=0) delete UI.cart[id]; if(!Object.keys(UI.cart).length) UI.sheet=null; render(); break;
    case 'method': UI.method=v; renderSheet(); break;
    case 'complete': completeSale(); break;
    case 'scanpos': startScan('pos'); break;
    case 'scanfield': startScan('field'); break;
    case 'manualbc': { const c=$('manualbc').value.trim(); if(c) gotCode(c); break; }
    case 'sharercpt': shareText(receiptText(UI.receipt.s,UI.receipt.cash),'Receipt'); break;
    case 'sharetx': shareText(receiptText(D.sales.find(x=>x.id===UI.txId),0),'Receipt'); break;
    case 'tx': UI.txId=id; UI.sheet='tx'; renderSheet(); break;
    case 'refund': { if(!confirmTwice(t,'Tap again to refund')) break; const s=D.sales.find(x=>x.id===id); s.refunded=true; s.items.forEach(i=>{const p=prod(i.pid); if(p) p.stock+=i.qty;});
      if(s.method==='Utang'){ const u=D.utang.find(x=>x.name===s.customer&&bal(x)>0); if(u) u.amount=Math.max(paidOf(u),u.amount-s.total); }
      save(); UI.sheet=null; render(); toast(`Sale #${s.id} refunded. Items returned to stock.`); break; }
    case 'pfilter': UI.pfilter=v; render(); break;
    case 'addprod': if(UI.tab==='home'){UI.tab='products';render();} openProdForm(null); break;
    case 'editprod': openProdForm(prod(id)); break;
    case 'saveprod': saveProduct(); break;
    case 'delprod': { if(!confirmTwice(t,'Tap again to delete')) break; const p=prod(UI.pform.id); D.products=D.products.filter(x=>x.id!==p.id); delete UI.cart[p.id]; UI.pform=null; UI.sheet=null; save(); render(); toast(`${p.name} deleted. Past sales keep their records.`); break; }
    case 'dostock': { const p=prod(+$('sp').value), q=Math.round(+$('sq').value||0), c=+$('sc').value; if(q<=0){toast('Enter the quantity received.');break;}
      if(c>=0) p.cost=c; p.stock+=q; p.supplier=$('ss').value.trim()||p.supplier; D.stockLog.push({pid:p.id,qty:q,cost:p.cost,time:Date.now(),type:'in'});
      if($('sx').checked) D.expenses.push({id:nid(),time:Date.now(),cat:'Stock purchase',amt:Math.round(q*p.cost*100)/100,method:$('sm').value,note:`${q} × ${p.name}`});
      save(); UI.sheet=null; render(); toast(`${q} added. ${p.name}: ${p.stock} in stock.`); break; }
    case 'rep': UI.rep=v; render(); break;
    case 'period': UI.period=v; render(); break;
    case 'editopen': { const r=dayRec(todayKey()); const inp=document.createElement('input'); inp.type='number'; inp.value=r.opening; inp.setAttribute('aria-label','Opening cash'); inp.style.cssText='width:110px;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px';
      t.parentNode.replaceChild(inp,t); inp.focus(); inp.addEventListener('change',()=>{ r.opening=+inp.value||0; save(); render(); toast('Opening cash updated.'); }); break; }
    case 'docount': { const c=$('counted').value; const r=dayRec(todayKey()); r.counted=c===''?null:+c; save(); render();
      if(r.counted!=null){ const d=Math.round((r.counted-cashFlow(todayKey()).expected)*100)/100; toast(d===0?'Drawer is balanced.':d<0?`Drawer is short by ${peso(-d,1)}.`:`Drawer is over by ${peso(d,1)}.`); } break; }
    case 'dowithdraw': { const amt=+$('wa').value; if(!(amt>0)){toast('Enter an amount.');break;} dayRec(todayKey()).withdrawals+=amt; save(); UI.sheet=null; render(); toast(`${peso(amt,1)} withdrawal saved.`); break; }
    case 'doexp': { const amt=+$('ea').value; if(!(amt>0)){toast('Enter an amount.');break;}
      D.expenses.push({id:nid(),time:Date.now(),cat:$('ec').value,amt,method:$('em').value,note:$('en').value.trim()}); save(); UI.sheet=null; render(); toast(`${peso(amt,1)} expense saved.`); break; }
    case 'delexp': { if(!confirmTwice(t,'?')) break; D.expenses=D.expenses.filter(x=>x.id!==id); save(); render(); toast('Expense deleted.'); break; }
    case 'utang': UI.utangId=id; UI.sheet='utang'; renderSheet(); break;
    case 'payutang': { const u=D.utang.find(x=>x.id===UI.utangId), amt=Math.min(+$('up').value||0,bal(u)); if(!(amt>0)){toast('Enter a payment amount.');break;}
      u.payments.push({time:Date.now(),amt,method:$('upm').value}); save(); UI.sheet=null; render(); toast(`${peso(amt,1)} received from ${u.name}. Balance: ${peso(bal(u),1)}.`); break; }
    case 'shareutang': shareText(UI.utangMsg,'Reminder'); break;
    case 'doutangnew': { const n=$('un').value.trim(), amt=+$('ua').value; if(!n||!(amt>0)){toast('Enter a name and amount.');break;}
      D.utang.push({id:nid(),name:n,phone:'',amount:amt,borrowed:Date.now(),due:$('ud').value||keyAdd(todayKey(),14),items:$('ui').value.trim()||'Old balance',payments:[]}); save(); UI.sheet=null; render(); toast(`Utang of ${n} saved.`); break; }
    case 'tin': { D.attendance.push({emp:id,date:todayKey(),tin:Date.now(),tout:null}); save(); render(); toast('Time in saved.'); break; }
    case 'tout': { const r=D.attendance.find(x=>x.emp===id&&x.date===todayKey()); r.tout=Date.now(); save(); render(); toast('Time out saved.'); break; }
    case 'savebiz': D.biz.name=$('bizname').value.trim()||D.biz.name; D.biz.owner=$('bizowner').value.trim()||D.biz.owner; D.biz.city=$('bizcity').value.trim(); const ow=D.employees.find(x=>x.role==='Owner'); if(ow) ow.name=D.biz.owner; save(); render(); toast('Profile saved.'); break;
    case 'user': D.user=id; save(); render(); toast(`${D.employees.find(x=>x.id===id).name} is now selling.`); break;
    case 'doemp': { const n=$('emn').value.trim(); if(!n){toast('Enter a name.');break;} D.employees.push({id:nid(),name:n,role:$('emr').value.trim()||'Staff',comm:+$('emc').value||0}); save(); UI.sheet=null; render(); break; }
    case 'delemp': { if(!confirmTwice(t,'?')) break; D.employees=D.employees.filter(x=>x.id!==id); if(D.user===id) D.user=1; save(); render(); break; }
    case 'setpin': { const p=$('newpin').value.trim(); if(!/^\d{4}$/.test(p)){toast('PIN must be 4 digits.');break;} D.biz.pin=p; save(); render(); toast('PIN saved. Remember it: it cannot be recovered.'); break; }
    case 'clearpin': D.biz.pin=''; save(); render(); toast('PIN removed.'); break;
    case 'backup': { D.lastBackup=Date.now(); save(); saveFile(`negosyo360-backup-${todayKey()}.json`,JSON.stringify(D),'application/json'); render(); break; }
    case 'restore': $('restoreFile').click(); break;
    case 'exportcsv': exportCSV(); break;
    case 'wipe': if(confirmTwice(t,'Tap again to erase everything')){ try{localStorage.removeItem(KEY);}catch(err){} D=null; UI.ob=null; UI.tab='home'; UI.unlocked=false; render(); } break;
    case 'askq': ask(v); break;
  }
});
function confirmTwice(btn,label){
  if(btn.dataset.armed){ return true; }
  btn.dataset.armed='1'; const old=btn.innerHTML; btn.innerHTML=label==='?'?'Sure?':label;
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.innerHTML=old; } },3000); return false;
}
document.addEventListener('change',e=>{
  if(e.target.id==='sp'){ UI.stockPid=+e.target.value; renderSheet(); }
  if(e.target.id==='sx'){ const m=$('sxm'); if(m) m.style.display=e.target.checked?'':'none'; }
  if(e.target.id==='udue'){ const u=D.utang.find(x=>x.id===UI.utangId); if(u&&e.target.value){ u.due=e.target.value; save(); render(); toast('Due date updated.'); } }
  if(e.target.id==='restoreFile'){ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!d.biz||!Array.isArray(d.products)||!Array.isArray(d.sales)) throw 0; D=d; save(); UI.unlocked=true; UI.tab='home'; render(); toast(`Backup restored: ${d.biz.name}.`); }catch(err){ toast('That file is not a Negosyo360 backup.'); } e.target.value=''; };
    r.readAsText(f); }
});
document.addEventListener('input',e=>{
  const el=e.target, id=el.id;
  if(id==='posq'||id==='prodq'){ if(id==='posq') UI.q=el.value; else UI.pq=el.value; const pos=el.selectionStart; render(); const n=$(id); n.focus(); try{n.setSelectionRange(pos,pos);}catch(err){} }
  if(id==='disc'||id==='cashin'){ if(id==='disc') UI.disc=el.value; else UI.cashIn=el.value;
    const total=Math.max(0,cartSub()-(+UI.disc||0)); $('totalOut').textContent=peso(total,1); $('completeBtn').textContent='Complete sale · '+peso(total,1);
    const co=$('changeOut'); if(co){ const ch=(+UI.cashIn||0)-total; co.textContent=UI.cashIn?peso(ch,1):'—'; co.style.color=UI.cashIn&&ch<0?'var(--bad)':'var(--good)'; } }
  if(id==='ref') UI.ref=el.value;
  if(id==='cust') UI.cust=el.value;
  if(el.dataset.pf){ UI.pform[el.dataset.pf]=el.value; if(el.dataset.pf==='price'||el.dataset.pf==='cost'){ const f=UI.pform,o=$('marginOut'); if(o) o.textContent=f.price&&f.cost?`Profit per piece: ${peso(f.price-f.cost,1)} (${Math.round((f.price-f.cost)/f.price*100)}% margin)`:'Enter cost and price to see your profit per piece.'; } }
  if(el.dataset.ob) readOb();
});
document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.id==='askform'){ const i=$('askin'); const q=i.value; i.value=''; ask(q); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&UI.sheet){ window.n360Back(); } });
window.addEventListener('resize',()=>{ if(D&&UI.tab==='reports'&&UI.rep==='summary') drawBars($('chart')); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&D&&D.biz.pin){ setTimeout(()=>{ if(document.hidden){ UI.unlocked=false; } },60000); } else if(!document.hidden&&D) render(); });

/* start */
D=load();
if(D&&!D.biz.pin) UI.unlocked=true;
render();
if('serviceWorker' in navigator && location.protocol==='https:' && !/appassets\.androidplatform\.net/.test(location.host)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
